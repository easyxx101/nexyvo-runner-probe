name: Encrypted validation
run-name: Encrypted validation ${{ inputs.campaign_id }}
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Owner-prepared single-use campaign ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: encrypted-private-validation
  cancel-in-progress: false
jobs:
  validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.run_attempt == 1 && github.ref == 'refs/heads/main' &&
      github.sha == vars.REVIEWED_CONTROLLER_SHA &&
      inputs.campaign_id == vars.AUTHORIZED_CAMPAIGN_ID
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CAMPAIGN_ID: ${{ inputs.campaign_id }}
      EVIDENCE_RECIPIENT: ${{ vars.EVIDENCE_RECIPIENT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned encryption dependencies
        timeout-minutes: 2
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Require owner-controlled first dispatch of reviewed controller
        id: guard
        timeout-minutes: 1
        env:
          PUBLIC_GUARD_TOKEN: ${{ github.token }}
          REVIEWED_CONTROLLER_SHA: ${{ vars.REVIEWED_CONTROLLER_SHA }}
          AUTHORIZED_CAMPAIGN_ID: ${{ vars.AUTHORIZED_CAMPAIGN_ID }}
        run: python controller.py guard
      - name: Recheck actual VM capacity and KVM before private inputs
        timeout-minutes: 1
        run: python controller.py prerequisites
      - name: Fetch and verify pinned private inputs
        id: fetch
        timeout-minutes: 5
        env:
          PRIVATE_INPUT_TOKEN: ${{ secrets.PRIVATE_INPUT_TOKEN }}
          PRIVATE_EXECUTION_PLAN: ${{ secrets.PRIVATE_EXECUTION_PLAN }}
        run: python controller.py fetch
      - name: Execute without private credentials and retain private output
        if: success()
        timeout-minutes: 35
        run: python controller.py execute
      - name: Seal complete or partial evidence before any upload
        if: always() && steps.guard.outcome == 'success'
        id: seal
        timeout-minutes: 3
        run: python controller.py seal
      - name: Upload ciphertext and reviewed aggregate receipt only
        if: always() && steps.seal.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-evidence-${{ inputs.campaign_id }}
          path: |
            sealed/evidence.bin
            sealed/receipt.json
          if-no-files-found: error
          retention-days: 7
